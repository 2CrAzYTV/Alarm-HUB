services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarmhub}
      POSTGRES_USER: ${POSTGRES_USER:-alarmhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - alarmhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alarmhub} -d ${POSTGRES_DB:-alarmhub}"]
      interval: 10s
      timeout: 5s
      retries: 10

  alarm-hub:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alarmhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alarmhub}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
    ports:
      - "${ALARM_HUB_PORT:-8080}:8080"

volumes:
  alarmhub-postgres:
