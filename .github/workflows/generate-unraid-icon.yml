name: Generate Unraid PNG icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - icon.svg
      - .github/workflows/generate-unraid-icon.yml

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate PNG
        run: rsvg-convert -w 512 -h 512 icon.svg -o icon.png

      - name: Commit generated PNG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png
          if git diff --cached --quiet; then
            echo "icon.png is already up to date"
          else
            git commit -m "Regenerate PNG icon from SVG"
            git push
          fi
