name: Generate Unraid PNG icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - icon.svg
      - .github/workflows/generate-unraid-icon.yml

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate PNG
        run: rsvg-convert -w 512 -h 512 icon.svg -o icon.png
      - name: Point Unraid template to PNG
        run: sed -i 's#https://raw.githubusercontent.com/2CrAzYTV/Alarm-HUB/main/icon.svg#https://raw.githubusercontent.com/2CrAzYTV/Alarm-HUB/main/icon.png#g' unraid/alarm-hub.xml
      - name: Commit generated icon and template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png unraid/alarm-hub.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add PNG icon and update Unraid template"
            git push
          fi
